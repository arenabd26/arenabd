<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARENA BD – Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0e1424;--cd:#172038;--ln:#27324f;--tx:#eef2ff;--mu:#8e9bc0;--ac:#06b6d4;--gr:#22c55e;--rd:#ef4444;--yl:#facc15;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Bengali",sans-serif}
#app{max-width:520px;margin:0 auto;padding:env(safe-area-inset-top,0) 14px calc(30px + env(safe-area-inset-bottom,0px))}
h2{margin:18px 0 10px}.card{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
button{border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:700;color:#fff;background:var(--ln);cursor:pointer}
button.p{background:var(--ac)}button.g{background:var(--gr)}button.r{background:var(--rd)}
input,select{width:100%;padding:11px;margin:4px 0 8px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:16px}
.ch{display:flex;gap:8px;margin-bottom:8px}.ch button{flex:1}
.tx{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln);font-size:14px}
.mu{color:var(--mu);font-size:13px}.msg{color:var(--yl);font-size:14px;min-height:20px}
textarea{width:100%;padding:11px;margin:4px 0 8px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit}
</style></head><body>
<div id="app"><h2>⚙️ ARENA BD অ্যাডমিন</h2><main id="v">লোড হচ্ছে…</main></div>
<script>
const SB_URL="https://qhvagjrhkmzioqirbumr.supabase.co",SB_KEY="sb_publishable_cB02gkNSLN-UjM6aWvIKuw_2QrjTgxz";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const val=id=>($("#"+id)||{}).value,num=id=>parseInt(val(id))||0;
let me,ms=[],pend=[],users=[],PAY={},modes=[],banners=[],msg="";
function setMsg(t){msg=t;document.querySelectorAll(".msg").forEach(e=>e.textContent=t)}
async function rpc(n,a){const{error}=await sb.rpc(n,a);await load();setMsg(error?"❌ "+error.message:"✓ হয়েছে")}
async function load(){
  const{data:{user}}=await sb.auth.getUser();
  if(!user){me=null;return render()}
  me=(await sb.from("profiles").select("*").eq("id",user.id).single()).data;
  if(me&&me.is_admin){
    ms=(await sb.from("matches").select("*,entries(user_id,game_names,profiles(name,uid))").neq("status","done").order("id",{ascending:false})).data||[];
    const rooms=(await sb.from("rooms").select("*")).data||[];ms.forEach(m=>{const r=rooms.find(r=>r.match_id===m.id)||{};m.room=r.room;m.rpass=r.password});
    pend=(await sb.from("deposits").select("*,profiles(name,uid)").eq("status","pending").order("id")).data||[];users=(await sb.rpc("admin_users")).data||[];modes=(await sb.from("modes").select("*").order("sort")).data||[];banners=(await sb.from("banners").select("*").order("sort")).data||[];PAY={};((await sb.from("settings").select("*")).data||[]).forEach(s=>PAY[s.key]=s.value);
  }
  render();
}
let ed=null;
function tl(t){const d=new Date(t);return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function form(){const m=ed||{},v=(k,d)=>esc(m[k]??d);
 return '<div class="card"><b>'+(ed?"✏️ ম্যাচ এডিট":"নতুন ম্যাচ")+'</b><select id="cm">'+modes.map(x=>'<option value="'+x.id+'"'+(m.mode_id===x.id?" selected":"")+'>'+esc(x.name)+'</option>').join("")+'</select><input id="c1" placeholder="নাম (BR SOLO MATCH)" value="'+v("title","")+'"><input id="c2" type="datetime-local" value="'+(m.starts?tl(m.starts):"")+'"><input id="c3" value="'+v("map","Bermuda")+'"><select id="c4">'+["Solo","Duo","Squad"].map(x=>'<option'+(m.type===x?" selected":"")+'>'+x+'</option>').join("")+'</select><input id="c5" type="number" placeholder="Total Prize" value="'+v("prize","")+'"><input id="c6" type="number" placeholder="Per Kill" value="'+v("kill","")+'"><input id="c7" type="number" placeholder="Entry Fee" value="'+v("fee","")+'"><input id="c8" type="number" placeholder="Slots" value="'+v("slots",48)+'"><textarea id="c9" rows="5" placeholder="Prize Pool, প্রতি লাইনে একটা&#10;Winner - 100 Taka&#10;2nd Position - 80 Taka">'+esc(m.prizes||"")+'</textarea><textarea id="c10" rows="6" placeholder="ম্যাচের নিয়মাবলী (ফাঁকা রাখলে ডিফল্ট নিয়ম দেখাবে)">'+esc(m.rules||"")+'</textarea><button class="p" style="width:100%" data-a="mk">'+(ed?"আপডেট করুন":"তৈরি করুন")+'</button>'+(ed?'<button style="width:100%;margin-top:8px" data-a="ednew">বাতিল</button>':"")}
async function shrink(file,max){return new Promise(res=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/im.width),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res(b),"image/jpeg",0.82)};im.src=URL.createObjectURL(file)})}
async function up(id,max){const el=$("#"+id),f=el&&el.files&&el.files[0];if(!f)return null;const b=await shrink(f,max),p=Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg",r=await sb.storage.from("media").upload(p,b,{contentType:"image/jpeg"});if(r.error)throw r.error;return sb.storage.from("media").getPublicUrl(p).data.publicUrl}
function media(M){const th=(u,w)=>'<img src="'+esc(u)+'" style="height:34px;width:'+w+'px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:8px">';
 return '<h2>গেম মোড</h2><div class="card">'+modes.map(x=>'<div class="tx"><span>'+th(x.image_url,34)+esc(x.name)+'</span><button class="r" data-a="dm" data-i="'+x.id+'">মুছুন</button></div><textarea id="mr'+x.id+'" rows="4" placeholder="এই মোডের নিয়ম">'+esc(x.rules||"")+'</textarea><button class="p" data-a="mrs" data-i="'+x.id+'" style="width:100%;margin-bottom:12px">নিয়ম সেভ</button>').join("")+'<b>নতুন মোড</b><input id="mn" placeholder="নাম (SOLO BR MATCH)"><textarea id="mr0" rows="4" placeholder="এই মোডের নিয়ম (ঐচ্ছিক)"></textarea><input id="mi" type="file" accept="image/*"><button class="p" style="width:100%" data-a="am">মোড যোগ করুন</button>'+M+'</div><h2>স্লাইডার ব্যানার</h2><div class="card">'+banners.map(x=>'<div class="tx"><span>'+th(x.image_url,60)+esc(x.link||"লিংক নেই")+'</span><button class="r" data-a="db" data-i="'+x.id+'">মুছুন</button></div>').join("")+'<input id="bl" placeholder="লিংক (WhatsApp চ্যানেল বা গ্রুপ)"><input id="bi" type="file" accept="image/*"><button class="p" style="width:100%" data-a="ab">ব্যানার যোগ করুন</button>'+M+'</div><h2>লোগো ও অ্যাপের নাম</h2><div class="card"><input id="an" placeholder="অ্যাপের নাম" value="'+esc(PAY.app_name||"")+'"><input id="li" type="file" accept="image/*"><button class="p" style="width:100%" data-a="sl">সেভ করুন</button>'+M+'</div>'}
function mcard(m){
  return '<div class="card"><b>'+esc(m.title)+'</b> <span class="mu">('+m.status+' · '+m.entries.length+'/'+m.slots+')</span><input id="rm'+m.id+'" placeholder="Room ID" value="'+esc(m.room)+'"><input id="rp'+m.id+'" placeholder="Room Password" value="'+esc(m.rpass)+'"><div class="ch"><button class="p" data-a="room" data-i="'+m.id+'">Room সেভ</button><button data-a="st" data-i="'+m.id+'" data-s="playing">Start</button><button data-a="ed" data-i="'+m.id+'">এডিট</button></div><select id="w'+m.id+'">'+m.entries.map(e=>'<option value="'+e.user_id+'">'+esc(e.game_names)+' – '+esc(e.profiles&&e.profiles.name)+'</option>').join("")+'</select><input id="a'+m.id+'" type="number" placeholder="প্রাইজ ৳"><button class="g" style="width:100%" data-a="prize" data-i="'+m.id+'">প্রাইজ দিয়ে ম্যাচ শেষ করুন</button></div>';
}
function render(){
  const v=$("#v"),M='<div class="msg" id="msg">'+esc(msg)+'</div>';
  if(!me){v.innerHTML='<div class="card"><input id="em" type="email" placeholder="অ্যাডমিন ইমেইল"><input id="pw" type="password" placeholder="পাসওয়ার্ড"><button class="p" style="width:100%" data-a="in">লগইন</button>'+M+'</div>';return}
  if(!me.is_admin){v.innerHTML='<div class="card">এই অ্যাকাউন্ট অ্যাডমিন নয়।<br><br><button class="r" data-a="out">লগআউট</button></div>';return}
  v.innerHTML='<div class="card"><b>পেন্ডিং ডিপজিট ('+pend.length+')</b><div class="mu">bKash/Nagad/Rocket অ্যাপে TrxID ও পরিমাণ মিলিয়ে Approve করুন</div>'+(pend.map(d=>'<div class="tx"><span>'+esc(d.profiles&&d.profiles.name)+' · '+esc(d.method)+'<br><b>'+esc(d.trx_id)+'</b></span><span>৳'+d.amount+' <button class="g" data-a="ok" data-i="'+d.id+'">Approve</button></span></div>').join("")||'<div class="mu" style="margin-top:8px">কিছু নেই</div>')+'</div>'+
  form()+M+'</div><h2>চলমান ম্যাচ</h2>'+(ms.map(mcard).join("")||'<div class="mu">কোনো ম্যাচ নেই</div>')+'<div class="card"><b>পেমেন্ট নম্বর (প্লেয়াররা দেখবে)</b><input id="pb" placeholder="bKash নম্বর" value="'+esc(PAY.bkash)+'"><input id="pn" placeholder="Nagad নম্বর" value="'+esc(PAY.nagad)+'"><input id="pr" placeholder="Rocket নম্বর" value="'+esc(PAY.rocket)+'"><b style="display:block;margin-top:8px">ডিফল্ট নিয়মাবলী (সব ম্যাচে)</b><textarea id="dr" rows="6" placeholder="সাধারণ নিয়ম">'+esc(PAY.rules)+'</textarea><button class="p" style="width:100%" data-a="savepay">সেভ করুন</button>'+M+'</div><h2>ইউজার ('+users.length+')</h2><div class="card">'+(users.map(u=>'<div class="tx"><span><b>'+esc(u.name)+'</b> · #'+esc(u.uid)+'<br><span class="mu">'+esc(u.email)+'</span></span><span>৳'+u.balance+'<br><span class="mu">ম্যাচ '+u.matches+'</span></span></div>').join("")||'<div class="mu">কেউ নেই</div>')+'</div>'+media(M)+'<button class="r" data-a="out">লগআউট</button>';
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,i=b.dataset.i,m=ms.find(x=>String(x.id)===i);
  if(a==="in"){const r=await sb.auth.signInWithPassword({email:val("em"),password:val("pw")});if(r.error)return setMsg("❌ "+r.error.message);await load()}
  else if(a==="out"){await sb.auth.signOut();me=null;render()}
  else if(a==="ok")rpc("approve_deposit",{did:+i});
  else if(a==="prize"){if(!val("w"+i)||num("a"+i)<=0)return setMsg("বিজয়ী ও প্রাইজ দিন");rpc("pay_prize",{mid:+i,uid:val("w"+i),amt:num("a"+i)})}
  else if(a==="room"){const r=await sb.from("rooms").upsert({match_id:+i,room:val("rm"+i),password:val("rp"+i)});await load();setMsg(r.error?"❌ "+r.error.message:"✓ Room সেভ হয়েছে")}
  else if(a==="st"){await sb.from("matches").update({status:b.dataset.s}).eq("id",i);load()}
  else if(a==="ed"){ed=ms.find(x=>String(x.id)===i);render();scrollTo(0,0)}
  else if(a==="ednew"){ed=null;render()}
  else if(a==="am"){try{const u=await up("mi",800);if(!val("mn").trim()||!u)return setMsg("নাম ও ছবি দিন");const r=await sb.from("modes").insert({name:val("mn").trim(),image_url:u,sort:modes.length,rules:val("mr0")});await load();setMsg(r.error?"❌ "+r.error.message:"✓ মোড যোগ হয়েছে")}catch(x){setMsg("❌ "+(x.message||"আপলোড হয়নি"))}}
  else if(a==="mrs"){const r=await sb.from("modes").update({rules:val("mr"+i)}).eq("id",i);await load();setMsg(r.error?"❌ "+r.error.message:"✓ নিয়ম সেভ হয়েছে")}
  else if(a==="dm"){if(!confirm("এই মোড মুছবেন? এর ম্যাচগুলো মোডহীন হয়ে যাবে।"))return;await sb.from("modes").delete().eq("id",i);await load();setMsg("✓ মুছে গেছে")}
  else if(a==="ab"){try{const u=await up("bi",1000);if(!u)return setMsg("ছবি বাছুন");const r=await sb.from("banners").insert({image_url:u,link:val("bl").trim(),sort:banners.length});await load();setMsg(r.error?"❌ "+r.error.message:"✓ ব্যানার যোগ হয়েছে")}catch(x){setMsg("❌ "+(x.message||"আপলোড হয়নি"))}}
  else if(a==="db"){await sb.from("banners").delete().eq("id",i);await load();setMsg("✓ মুছে গেছে")}
  else if(a==="sl"){try{const u=await up("li",300),rows=[{key:"app_name",value:val("an").trim()}];if(u)rows.push({key:"logo",value:u});const r=await sb.from("settings").upsert(rows);await load();setMsg(r.error?"❌ "+r.error.message:"✓ সেভ হয়েছে")}catch(x){setMsg("❌ "+(x.message||"আপলোড হয়নি"))}}
  else if(a==="savepay"){const r=await sb.from("settings").upsert([{key:"bkash",value:val("pb").trim()},{key:"nagad",value:val("pn").trim()},{key:"rocket",value:val("pr").trim()},{key:"rules",value:val("dr")}]);await load();setMsg(r.error?"❌ "+r.error.message:"✓ নম্বর সেভ হয়েছে")}
  else if(a==="mk"){if(!val("c1")||!val("c2"))return setMsg("নাম ও সময় দিন");
    const o={title:val("c1"),starts:new Date(val("c2")).toISOString(),map:val("c3"),type:val("c4"),prize:num("c5"),kill:num("c6"),fee:num("c7"),slots:num("c8")||48,prizes:val("c9"),rules:val("c10"),mode_id:+val("cm")||null};const r=ed?await sb.from("matches").update(o).eq("id",ed.id):await sb.from("matches").insert(o);const was=ed;if(!r.error)ed=null;await load();setMsg(r.error?"❌ "+r.error.message:was?"✓ আপডেট হয়েছে":"✓ ম্যাচ তৈরি হয়েছে")}
});
load();
</script></body></html>
