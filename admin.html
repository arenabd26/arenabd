      pp:'<div class="card"><b>⚠️ Important Notice (অ্যাপ খুললেই পপআপ আসবে)</b><div class="mu">ফাঁকা রেখে সেভ করলে পপআপ বন্ধ হয়ে যাবে।</div><textarea id="ppt" rows="10" placeholder="যেমন: প্রথমে নিয়ম পড়ুন। একাধিক আইডি দিয়ে খেললে ব্যান করা হবে। উইথড্র ১০০ টাকার নিচে ৫ টাকা চার্জ...">'+esc(PAY.popup)+'</textarea><button class="p" style="width:100%" data-a="savepp">সেভ করুন</button>'+M+'</div>',
      ib:'<div class="card"><b>পাওয়া SMS ('+inbox.length+')</b><div class="mu">ফোন থেকে আসা টাকা-পাওয়ার SMS। "ব্যবহৃত" মানে কোনো ডিপজিটের সাথে মিলে গেছে।</div>'+(inbox.map(r=>'<div class="tx"><span>'+esc(r.method)+' · <b>'+esc(r.trx_id)+'</b><br><span class="mu">'+fmt(r.at)+'</span></span><span><b>৳'+r.amount+'</b><br><span class="mu">'+(r.used?"✓ ব্যবহৃত":"অপেক্ষায়")+'</span></span></div>').join("")||'<div class="mu" style="margin-top:8px">এখনো কোনো SMS আসেনি</div>')+'</div>',
      st:pay+P[2]+P[3]
    };
    h='<div class="mu" data-a="sec" data-v="" style="cursor:pointer;margin-bottom:8px">← মেনু</div>'+(S[sec]||"");
  }
  v.innerHTML=h;applyUq();
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,i=b.dataset.i,m=ms.find(x=>String(x.id)===i);
  if(a==="in"){const r=await sb.auth.signInWithPassword({email:val("em"),password:val("pw")});if(r.error)return setMsg("❌ "+r.error.message);await load()}
  else if(a==="out"){await sb.auth.signOut();me=null;render()}
  else if(a==="sec"){sec=b.dataset.v;msg="";render();scrollTo(0,0)}
  else if(a==="rem"){for(const d of pend){await sb.rpc("match_deposit",{p_trx:d.trx_id})}await load();setMsg("✓ আবার মেলানো হয়েছে")}
  else if(a==="wok")rpc("approve_withdraw",{p_id:+i})
  else if(a==="wno"){if(confirm("বাতিল করলে টাকা প্লেয়ারের ওয়ালেটে ফেরত যাবে।"))rpc("reject_withdraw",{p_id:+i})}
  else if(a==="nadd"){if(!val("nb").trim())return setMsg("মেসেজ লিখুন");const r=await sb.from("notices").insert({body:val("nb").trim()});await load();setMsg(r.error?"❌ "+r.error.message:"✓ পাঠানো হয়েছে")}
  else if(a==="ndel"){await sb.from("notices").delete().eq("id",i);await load();setMsg("✓ মুছে গেছে")}
  else if(a==="ok")rpc("approve_deposit",{did:+i});
  else if(a==="prize"){if(!val("w"+i)||num("a"+i)<=0)return setMsg("বিজয়ী ও প্রাইজ দিন");rpc("pay_prize",{mid:+i,uid:val("w"+i),amt:num("a"+i)})}
  else if(a==="room"){const r=await sb.from("rooms").upsert({match_id:+i,room:val("rm"+i),password:val("rp"+i)});await load();setMsg(r.error?"❌ "+r.error.message:"✓ Room সেভ হয়েছে")}
  else if(a==="st"){await sb.from("matches").update({status:b.dataset.s}).eq("id",i);load()}
  else if(a==="ed"){ed=ms.find(x=>String(x.id)===i);render();scrollTo(0,0)}
  else if(a==="ednew"){ed=null;render()}
  else if(a==="am"){try{const u=await up("mi",800);if(!val("mn").trim()||!u)return setMsg("নাম ও ছবি দিন");const r=await sb.from("modes").insert({name:val("mn").trim(),image_url:u,sort:modes.length,rules:val("mr0")});await load();setMsg(r.error?"❌ "+r.error.message:"✓ মোড যোগ হয়েছে")}catch(x){setMsg("❌ "+(x.message||"আপলোড হয়নি"))}}
  else if(a==="uadd"||a==="usub"){const x=num("ua"+i);if(x<=0)return setMsg("পরিমাণ দিন");rpc("admin_adjust",{p_id:i,p_amt:a==="uadd"?x:-x,p_note:a==="uadd"?"Admin Added":"Admin Deducted"})}
  else if(a==="gsv"){const r=await sb.from("entries").update({game_names:val("ge"+i+"_"+b.dataset.u).trim()}).eq("match_id",i).eq("user_id",b.dataset.u);await load();setMsg(r.error?"❌ "+r.error.message:"✓ নাম সেভ হয়েছে")}
  else if(a==="grm"){if(!confirm("এই প্লেয়ারকে ম্যাচ থেকে বাদ দেবেন?"))return;const rf=confirm("এন্ট্রি ফি ফেরত দেবেন?\nOK = ফেরত দিন, Cancel = ফেরত না");rpc("admin_remove_entry",{p_match:+i,p_user:b.dataset.u,p_refund:rf})}
  else if(a==="dmt"){if(confirm("ম্যাচ মুছলে সবার এন্ট্রি ফি ফেরত যাবে। নিশ্চিত?"))rpc("admin_delete_match",{p_id:+i})}
  else if(a==="uz"){if(confirm("এই ইউজারের পুরো ব্যালেন্স ০ হয়ে যাবে। নিশ্চিত?"))rpc("admin_zero",{p_id:i})}
  else if(a==="ub"){const ban=b.dataset.b==="1";if(!ban||confirm("ব্যান করলে এই ইমেইল দিয়ে আর অ্যাপে ঢুকতে বা টাকার কাজ করতে পারবে না। নিশ্চিত?"))rpc("admin_ban",{p_id:i,p_ban:ban})}
  else if(a==="unm"){rpc("admin_set_name",{p_id:i,p_name:val("un"+i).trim()})}
  else if(a==="ss"){const rows=[["s_wa","s1"],["s_tg","s2"],["s_yt","s3"],["s_fb","s4"],["s_dep","s5"],["s_room","s6"],["s_join","s7"]].map(x=>({key:x[0],value:val(x[1]).trim()}));const r=await sb.from("settings").upsert(rows);await load();setMsg(r.error?"❌ "+r.error.message:"✓ লিংক সেভ হয়েছে")}
  else if(a==="mrs"){const r=await sb.from("modes").update({rules:val("mr"+i)}).eq("id",i);await load();setMsg(r.error?"❌ "+r.error.message:"✓ নিয়ম সেভ হয়েছে")}
  else if(a==="dm"){if(!confirm("এই মোড মুছবেন? এর ম্যাচগুলো মোডহীন হয়ে যাবে।"))return;await sb.from("modes").delete().eq("id",i);await load();setMsg("✓ মুছে গেছে")}
  else if(a==="ab"){try{const u=await up("bi",1000);if(!u)return setMsg("ছবি বাছুন");const r=await sb.from("banners").insert({image_url:u,link:val("bl").trim(),sort:banners.length});await load();setMsg(r.error?"❌ "+r.error.message:"✓ ব্যানার যোগ হয়েছে")}catch(x){setMsg("❌ "+(x.message||"আপলোড হয়নি"))}}
  else if(a==="db"){await sb.from("banners").delete().eq("id",i);await load();setMsg("✓ মুছে গেছে")}
  else if(a==="sl"){try{const u=await up("li",300),rows=[{key:"app_name",value:val("an").trim()}];if(u)rows.push({key:"logo",value:u});const r=await sb.from("settings").upsert(rows);await load();setMsg(r.error?"❌ "+r.error.message:"✓ সেভ হয়েছে")}catch(x){setMsg("❌ "+(x.message||"আপলোড হয়নি"))}}
  else if(a==="savepp"){const r=await sb.from("settings").upsert([{key:"popup",value:val("ppt").trim()}]);await load();setMsg(r.error?"❌ "+r.error.message:"✓ নোটিশ সেভ হয়েছে")}
  else if(a==="savepay"){const r=await sb.from("settings").upsert([{key:"bkash",value:val("pb").trim()},{key:"nagad",value:val("pn").trim()},{key:"rocket",value:val("pr").trim()},{key:"rules",value:val("dr")},{key:"min_wd",value:val("mw").trim()},{key:"auto_max",value:val("am").trim()},{key:"auto_first_max",value:val("af").trim()}]);await load();setMsg(r.error?"❌ "+r.error.message:"✓ নম্বর সেভ হয়েছে")}
  else if(a==="mk"){if(!val("c1")||!val("c2"))return setMsg("নাম ও সময় দিন");
    const o={title:val("c1"),starts:new Date(val("c2")+":00+06:00").toISOString(),map:val("c3"),type:val("c4"),prize:num("c5"),kill:num("c6"),fee:num("c7"),slots:num("c8")||48,prizes:val("c9"),rules:val("c10"),mode_id:+val("cm")||null};const r=ed?await sb.from("matches").update(o).eq("id",ed.id):await sb.from("matches").insert(o);const was=ed;if(!r.error)ed=null;await load();setMsg(r.error?"❌ "+r.error.message:was?"✓ আপডেট হয়েছে":"✓ ম্যাচ তৈরি হয়েছে")}
});
